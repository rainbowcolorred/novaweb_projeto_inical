<svg xmlns="http://www.w3.org/2000/svg" width="380" height="150" viewBox="0 0 380 150">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Allura');</style>

    <!-- Padrão xadrez (gingham) para a toalha -->
    <pattern id="gingham" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFF8F2"/>
      <rect x="0" y="0" width="4" height="4" fill="rgba(248,215,218,0.55)"/>
      <rect x="4" y="4" width="4" height="4" fill="rgba(248,215,218,0.55)"/>
      <rect x="4" y="0" width="4" height="4" fill="rgba(248,215,218,0.28)"/>
      <rect x="0" y="4" width="4" height="4" fill="rgba(248,215,218,0.28)"/>
    </pattern>

    <!-- Clip da cesta -->
    <clipPath id="basketClip">
      <path d="M164 131 C162 109 166 89 175 88 L205 88 C214 89 218 109 216 131 Z"/>
    </clipPath>
  </defs>

  <!-- ── Galhos botânicos (cantos superiores) ── -->
  <!-- Esquerdo (espelhado) -->
  <g transform="translate(18,8) scale(-1,1) translate(-52,0)" opacity="0.8">
    <path d="M5 27 Q16 17 26 12 Q36 7 47 5" stroke="#A8C09A" stroke-width="1"
          stroke-linecap="round" fill="none"/>
    <ellipse cx="20" cy="15" rx="4" ry="2.4" fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-35 20 15)"/>
    <ellipse cx="33" cy="9"  rx="4" ry="2.4" fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-20 33 9)"/>
    <ellipse cx="43" cy="6"  rx="3" ry="2"   fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-10 43 6)"/>
  </g>
  <!-- Direito -->
  <g transform="translate(310,8)" opacity="0.8">
    <path d="M5 27 Q16 17 26 12 Q36 7 47 5" stroke="#A8C09A" stroke-width="1"
          stroke-linecap="round" fill="none"/>
    <ellipse cx="20" cy="15" rx="4" ry="2.4" fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-35 20 15)"/>
    <ellipse cx="33" cy="9"  rx="4" ry="2.4" fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-20 33 9)"/>
    <ellipse cx="43" cy="6"  rx="3" ry="2"   fill="#A8C09A" fill-opacity="0.5"
             transform="rotate(-10 43 6)"/>
  </g>

  <!-- ── Texto principal ── -->
  <text x="190" y="43"
        font-family="Allura, cursive"
        font-size="46"
        fill="#5C4033"
        text-anchor="middle"
        dominant-baseline="middle">Mesa Posta</text>

  <!-- ── Divisor com laço ── -->
  <line x1="110" y1="64" x2="168" y2="64" stroke="#F8D7DA" stroke-width="1"/>
  <!-- Asa esquerda do laço -->
  <path d="M190 64 C187 61 181 58 177 60 C174 62 176 65 179 64 C182 63 185 62 190 64"
        fill="#F8D7DA" stroke="#E8B4B8" stroke-width="0.7"/>
  <!-- Asa direita do laço -->
  <path d="M190 64 C193 61 199 58 203 60 C206 62 204 65 201 64 C198 63 195 62 190 64"
        fill="#F8D7DA" stroke="#E8B4B8" stroke-width="0.7"/>
  <!-- Nó central -->
  <ellipse cx="190" cy="64" rx="2.5" ry="2" fill="#E8B4B8"/>
  <!-- Fitas caindo -->
  <line x1="189" y1="66" x2="187" y2="71" stroke="#E8B4B8" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="191" y1="66" x2="193" y2="71" stroke="#E8B4B8" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="212" y1="64" x2="270" y2="64" stroke="#F8D7DA" stroke-width="1"/>

  <!-- ════ ILUSTRAÇÃO PIQUENIQUE ════ -->

  <!-- Toalha xadrez (gingham) -->
  <rect x="126" y="130" width="128" height="15" rx="4"
        fill="url(#gingham)" stroke="#E8B4B8" stroke-width="0.8"/>
  <!-- Borda pontilhada da toalha -->
  <line x1="130" y1="145" x2="250" y2="145"
        stroke="#E8B4B8" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- ── CESTA de vime ── -->
  <!-- Corpo da cesta -->
  <path d="M164 131 C162 109 166 89 175 88 L205 88 C214 89 218 109 216 131 Z"
        fill="#C8935A" stroke="#7A5230" stroke-width="1.2"/>

  <!-- Textura de vime (clipada para a cesta) -->
  <g clip-path="url(#basketClip)">
    <!-- Linhas horizontais -->
    <line x1="155" y1="96"  x2="225" y2="96"  stroke="#7A5230" stroke-width="0.9" opacity="0.38"/>
    <line x1="155" y1="104" x2="225" y2="104" stroke="#7A5230" stroke-width="0.9" opacity="0.38"/>
    <line x1="155" y1="112" x2="225" y2="112" stroke="#7A5230" stroke-width="0.9" opacity="0.38"/>
    <line x1="155" y1="120" x2="225" y2="120" stroke="#7A5230" stroke-width="0.9" opacity="0.38"/>
    <line x1="155" y1="128" x2="225" y2="128" stroke="#7A5230" stroke-width="0.9" opacity="0.38"/>
    <!-- Linhas verticais (textura) -->
    <line x1="170" y1="84" x2="170" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="177" y1="84" x2="177" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="184" y1="84" x2="184" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="190" y1="84" x2="190" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="196" y1="84" x2="196" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="203" y1="84" x2="203" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
    <line x1="210" y1="84" x2="210" y2="135" stroke="#7A5230" stroke-width="0.6" opacity="0.2"/>
  </g>

  <!-- Borda/aba da cesta -->
  <line x1="170" y1="94" x2="210" y2="94" stroke="#7A5230" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Alça da cesta (sombra externa) -->
  <path d="M174 89 Q190 69 206 89" fill="none" stroke="#7A5230" stroke-width="5.5"
        stroke-linecap="round"/>
  <!-- Alça da cesta (brilho interno) -->
  <path d="M174 89 Q190 69 206 89" fill="none" stroke="#C8935A" stroke-width="3.2"
        stroke-linecap="round"/>

  <!-- Flores espreitando da abertura da cesta -->
  <!-- Flor 1 (esquerda) -->
  <circle cx="181" cy="85" r="2.2" fill="#F8D7DA"/>
  <circle cx="181" cy="91" r="2.2" fill="#F8D7DA"/>
  <circle cx="178" cy="88" r="2.2" fill="#F8D7DA"/>
  <circle cx="184" cy="88" r="2.2" fill="#F8D7DA"/>
  <circle cx="181" cy="88" r="2"   fill="#FBBF8C"/>
  <!-- Flor 2 (centro, mais alta) -->
  <circle cx="190" cy="82" r="2.5" fill="#F5D0DC"/>
  <circle cx="190" cy="90" r="2.5" fill="#F5D0DC"/>
  <circle cx="186" cy="86" r="2.5" fill="#F5D0DC"/>
  <circle cx="194" cy="86" r="2.5" fill="#F5D0DC"/>
  <circle cx="190" cy="86" r="2.2" fill="#FBBF8C"/>
  <!-- Flor 3 (direita) -->
  <circle cx="199" cy="85" r="2.2" fill="#F8D7DA"/>
  <circle cx="199" cy="91" r="2.2" fill="#F8D7DA"/>
  <circle cx="196" cy="88" r="2.2" fill="#F8D7DA"/>
  <circle cx="202" cy="88" r="2.2" fill="#F8D7DA"/>
  <circle cx="199" cy="88" r="2"   fill="#FBBF8C"/>
  <!-- Haste das flores -->
  <path d="M184 90 Q185 86 183 84" stroke="#A8C09A" stroke-width="1"
        fill="none" stroke-linecap="round"/>
  <path d="M196 90 Q195 86 197 84" stroke="#A8C09A" stroke-width="1"
        fill="none" stroke-linecap="round"/>

  <!-- ── MORANGO (esquerda da cesta) ── -->
  <!-- Corpo (gota invertida: topo arredondado, ponta embaixo) -->
  <path d="M142 125 C134 121 134 108 142 104 C150 108 150 121 142 125 Z"
        fill="#E07878" stroke="#B05050" stroke-width="0.8"/>
  <!-- Brilho -->
  <path d="M138 108 Q136 114 138 119" stroke="rgba(255,248,242,0.4)"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Sementes -->
  <circle cx="139" cy="111" r="0.8" fill="rgba(255,248,242,0.7)"/>
  <circle cx="144" cy="108" r="0.8" fill="rgba(255,248,242,0.7)"/>
  <circle cx="145" cy="115" r="0.8" fill="rgba(255,248,242,0.7)"/>
  <circle cx="140" cy="120" r="0.8" fill="rgba(255,248,242,0.7)"/>
  <!-- Folhinhas verdes -->
  <path d="M140 104 Q137 98 140 95 Q143 98 140 104" fill="#88B070"/>
  <path d="M142 104 Q142 97 146 95 Q145 99 142 104" fill="#88B070" opacity="0.85"/>
  <path d="M140 104 Q136 98 133 97 Q136 101 140 104" fill="#88B070" opacity="0.7"/>

  <!-- ── MACARRON (direita da cesta) ── -->
  <!-- Concha superior -->
  <ellipse cx="237" cy="109" rx="11" ry="6.5" fill="#F0A8B8" stroke="#D08090" stroke-width="0.7"/>
  <!-- Recheio (creme) -->
  <rect x="227" y="113.5" width="20" height="4.5" rx="1.5" fill="#FFF0E8" opacity="0.9"/>
  <!-- Concha inferior -->
  <ellipse cx="237" cy="119" rx="11" ry="6.5" fill="#F0A8B8" stroke="#D08090" stroke-width="0.7"/>
  <!-- Brilho das conchas -->
  <ellipse cx="233" cy="107" rx="4" ry="1.8" fill="white" opacity="0.2"/>
  <ellipse cx="233" cy="117" rx="4" ry="1.8" fill="white" opacity="0.2"/>

</svg>