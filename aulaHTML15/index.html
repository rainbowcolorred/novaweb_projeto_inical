<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        Aluno(a): ______________________________
        Turma: __________________________________
        Curso: Técnico em Desenvolvimento de Sistemas
        Atividade: Aula 15 - JavaScript aplicado a Formulários
    -->

    <main class="container">
        <header>
            <h1>Formulário de Cadastro</h1>
            <p>Aula 15 - JavaScript aplicado a Formulários</p>
        </header>

        <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>

        <form id="formCadastro" novalidate>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade">
            </div>

            <p id="digitando" class="digitando">Preencha seus dados para começar.</p>

            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
